name: verify-build-v3
on:
  pull_request:
    branches:
      - main

jobs:
  clang-tidy:
    name: verify-build v3
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake 4.1
        run: |
          pip install cmake==4.1.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++-14-dev zstd ninja-build

      - name: Cache LLVM 22
        uses: actions/cache@v6
        id: cache-llvm
        with:
          path: ~/llvm-22
          key: llvm-22.1.0-linux-x64

      - name: Download LLVM 22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz
          mkdir -p ~/llvm-22
          tar -xf LLVM-22.1.0-Linux-X64.tar.xz -C ~/llvm-22 --strip-components=1

      - name: Remove system LLVM/Clang
        run: |
          sudo apt-get remove -y llvm* clang* libclang*
          sudo apt-get autoremove -y

      - name: Add LLVM to PATH
        run: echo "/home/runner/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang-tidy --version
          clang++ --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_INSTALL_DIR=$HOME/llvm-22 \
            -DENABLE_V2_EXAMPLES=ON

      - name: Build
        run: |
          cmake --build build

      # ---- examples ----

      # -- logical_plan --

      - name: Build example_logical_plan
        run: cmake --build build --target example_logical_plan

      - name: Run example_logical_plan
        run: build/examples/v2/logical_plan/example_logical_plan

      # -- full --

      - name: Build example_full
        run: cmake --build build --target example_full

      - name: Run example_full
        run: build/examples/v2/logical_plan/example_full

      # -- project --

      - name: Build example_project
        run: cmake --build build --target example_project

      - name: Run example_project
        run: build/examples/v2/logical_plan/example_project

      # -- select --

      - name: Build example_select
        run: cmake --build build --target example_select

      - name: Run example_select
        run: build/examples/v2/logical_plan/example_select

      # -- read_ndjson --

      - name: Build example_read_ndjson
        run: cmake --build build --target example_read_ndjson

      - name: Run example_read_ndjson
        run: build/examples/v2/logical_plan/example_read_ndjson

      # -- write_ndjson --

      - name: Build example_write_ndjson
        run: cmake --build build --target example_write_ndjson

      - name: Run example_write_ndjson
        run: build/examples/v2/logical_plan/example_write_ndjson

      # -- write_json --

      - name: Build example_write_json
        run: cmake --build build --target example_write_json

      - name: Run example_write_json
        run: build/examples/v2/logical_plan/example_write_json

      # -- count_window --

      - name: Build example_count_window
        run: cmake --build build --target example_count_window

      - name: Run example_count_window
        run: build/examples/v2/logical_plan/example_count_window

      # -- time_window --

      - name: Build example_time_window
        run: cmake --build build --target example_time_window

      - name: Run example_time_window
        run: build/examples/v2/logical_plan/example_time_window

      # -- merge --

      - name: Build example_merge
        run: cmake --build build --target example_merge

      - name: Run example_merge
        run: build/examples/v2/logical_plan/example_merge

      # -- merge_measure --

      - name: Build example_merge_measure
        run: cmake --build build --target merge_measure

      - name: Run merge_measure
        run: build/examples/v2/logical_plan/merge_measure

      # -- interval_join --

      - name: Build example_interval_join
        run: cmake --build build --target example_interval_join

      - name: Run example_interval_join
        run: build/examples/v2/logical_plan/example_interval_join