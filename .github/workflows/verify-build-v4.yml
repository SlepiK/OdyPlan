name: verify-build-v5
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  clang-tidy:
    name: verify-build v5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake 4.1
        run: |
          pip install cmake==4.1.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install Ninja and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++-14-dev zstd ninja-build libspdlog-dev nlohmann-json3-dev

      - name: Remove system LLVM/Clang
        run: |
          sudo apt-get remove -y llvm* clang* libclang*
          sudo apt-get autoremove -y

      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          
          echo "/usr/bin" >> $GITHUB_PATH
          echo "LLVM_CONFIG=/usr/bin/llvm-config-22" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          clang-tidy-22 --version
          clang++-22 --version
          llvm-config-22 --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DODYPLAN_VERSION=v3 \
            -DODYPLAN_USE_SYSTEM_DEPS=ON \
            -DENABLE_V3_EXAMPLES=ON \
            -DENABLE_TOOLING=ON \
            -DENABLE_CLANG_TIDY=OFF

      # ---- library ----

      - name: Build odyplan_core_all
        run: cmake --build build --target odyplan_core_all

      # ---- library ----

      - name: Build odyplan_basic_all
        run: cmake --build build --target odyplan_basic_all


      # ---- examples ----

      - name: Build odyplan_example_all
        run: cmake --build build --target odyplan_example_all

      # ---- checks ----

      - name: Build odyplan_example_check_all
        run: cmake --build build --target odyplan_example_check_all

      # ---- ctest ----

      - name: Run CTest
        run: |
          cd build
          ctest --output-on-failure
