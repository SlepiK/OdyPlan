name: verify-build-v5
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  clang-tidy:
    name: verify-build v5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Aggressive cleanup
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

          # Remove PowerShell
          sudo rm -rf /usr/local/share/powershell

          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache

          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Install CMake 4.1
        run: |
          pip install cmake==4.1.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install Ninja and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++-14-dev zstd ninja-build libspdlog-dev nlohmann-json3-dev

      - name: Remove system LLVM/Clang
        run: |
          sudo apt-get remove -y llvm* clang* libclang*
          sudo apt-get autoremove -y

      - name: Download LLVM 22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main"
    
          sudo apt-get update
          sudo apt-get install -y \
            llvm-22-dev \
            libclang-22-dev \
            clang-22 \ 
            clang-tidy-22

      - name: Verify toolchain
        run: |
          clang-tidy --version
          clang++ --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_INSTALL_DIR=$HOME/llvm-22 \
            -DODYPLAN_VERSION=v3 \
            -DODYPLAN_USE_SYSTEM_DEPS=ON \
            -DENABLE_V3_EXAMPLES=ON \
            -DENABLE_TOOLING=ON \
            -DENABLE_CLANG_TIDY=OFF

      # ---- library ----

      - name: Build odyplan_core_all
        run: cmake --build build --target odyplan_core_all

      # ---- library ----

      - name: Build odyplan_basic_all
        run: cmake --build build --target odyplan_basic_all


      # ---- examples ----

      - name: Build odyplan_example_all
        run: cmake --build build --target odyplan_example_all

      # ---- checks ----

      - name: Build odyplan_example_check_all
        run: cmake --build build --target odyplan_example_check_all

      # ---- ctest ----

      - name: Run CTest
        run: |
          cd build
          ctest --output-on-failure
