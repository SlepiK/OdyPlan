name: linter-clang-tidy-v3

on:
  pull_request:
    branches:
      - main

jobs:
  clang-tidy:
    name: clang-tidy check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake 4.1
        run: |
          pip install cmake==4.1.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++-14-dev zstd ninja-build

      - name: Cache LLVM 22
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: ~/llvm-22
          key: llvm-22.1.0-linux-x64

      - name: Download LLVM 22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz
          mkdir -p ~/llvm-22
          tar -xf LLVM-22.1.0-Linux-X64.tar.xz -C ~/llvm-22 --strip-components=1

      - name: Remove system LLVM/Clang
        run: |
          sudo apt-get remove -y llvm* clang* libclang*
          sudo apt-get autoremove -y

      - name: Add LLVM to PATH
        run: echo "/home/runner/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang-tidy --version
          clang++ --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_INSTALL_DIR=$HOME/llvm-22
          
      - name: Run clang-tidy
        run: |
          if [[ ! -d odyplan/v3/core ]]; then
            echo "No v3/core directory found. Skipping clang-tidy."
            exit 0
          fi
            
          FILES=$(find odyplan/v3/core/*/include -type f -name '*.h' 2>/dev/null)
            
          if [[ -z "$FILES" ]]; then
            echo "No header files found. Skipping clang-tidy."
            exit 0
          fi
            
          echo "$FILES" | xargs clang-tidy -p build \
            --header-filter='odyplan/v3/core/.*/include/.*' \
            --warnings-as-errors='*'

